<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BHD Control Tower — Tesla Energy | Demonstration</title>
<meta name="description" content="Backhaul Direct Control Tower demonstration. All data is synthetic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2340'/%3E%3Ccircle cx='24' cy='24' r='4' fill='%23B5D334'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F2340;--navy-2:#18345C;--navy-3:#24456F;--blue:#1F5FBF;--blue-d:#174A96;--blue-50:#EAF1FB;--lime:#B5D334;
  --ink:#18212F;--ink-2:#46505F;--ink-3:#5F6B7A;--line:#DCE2EA;--line-2:#E9EDF2;--bg:#F3F5F8;--card:#FFFFFF;
  --ok:#1D7044;--ok-bg:#E6F3EB;--warn:#8F5200;--warn-bg:#FFF3DC;--bad:#B1271B;--bad-bg:#FCEBE8;--nt:#4A5568;--nt-bg:#EDF0F4;
  --r:6px;--r-lg:10px;--sh:0 1px 2px rgba(16,35,64,.06),0 2px 8px rgba(16,35,64,.05);
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13.5px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink-3)}.small{font-size:12px}.nowrap{white-space:nowrap}.right{text-align:right}
.app{display:grid;grid-template-columns:200px 1fr;height:100vh}
/* ---------- rail ---------- */
.rail{background:var(--navy);color:#DCE6F5;display:flex;flex-direction:column;padding:12px 10px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 6px 14px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--navy-3);display:grid;place-items:center;position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;background:var(--lime)}
.brand-mark span{font-weight:700;font-size:12px;letter-spacing:.02em;color:#fff;margin:-4px 4px 0 0}
.brand-txt{line-height:1.15}.brand-txt b{display:block;color:#fff;font-size:14px;font-weight:600}.brand-txt small{color:#9FB2CF;font-size:11px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;color:#C9D6EA;border-radius:6px;cursor:pointer;text-align:left;font-size:13.5px}
.nav-btn svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7}
.nav-btn:hover{background:var(--navy-2);color:#fff}
.nav-btn[aria-current="page"]{background:var(--blue);color:#fff}
.nav-btn .ct{margin-left:auto;font-size:11px;background:rgba(255,255,255,.14);padding:0 6px;border-radius:9px}
.nav-sep{margin:14px 10px 6px;font-size:11.5px;color:#8EA3C2}
.rail-foot{margin-top:auto;padding:10px 8px 4px;font-size:11.5px;color:#8EA3C2;border-top:1px solid var(--navy-2)}
/* ---------- top ---------- */
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
@media (min-width:1181px){.top{flex-wrap:nowrap}.filters{flex-wrap:nowrap}.filters .sel{max-width:150px}.acct b{white-space:nowrap}}
.acct{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.acct b{font-size:14.5px;font-weight:600}.acct span{font-size:11.5px;color:var(--ink-3)}
.filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.filters .sel{max-width:168px}
.sel,.inp{height:30px;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0 8px;font-size:13px;max-width:100%}
.sel:hover,.inp:hover{border-color:#C3CCD8}
.search{position:relative;flex:1 1 140px;min-width:120px;max-width:260px}
.search input{width:100%;padding-left:28px}
.search svg{position:absolute;left:8px;top:8px;width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:2}
.top-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.badge-demo{font-size:11.5px;font-weight:600;color:var(--warn);background:var(--warn-bg);border:1px solid #F1D9A8;padding:2px 8px;border-radius:12px;white-space:nowrap}
.btn{height:30px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:var(--r);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:#F6F8FB;border-color:#C3CCD8}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--nt-bg)}
.btn.danger{color:var(--bad);border-color:#F0C6C0}
.btn.sm{height:26px;padding:0 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.persona{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);border-left:1px solid var(--line);padding-left:10px}
.strip{display:flex;gap:14px;align-items:center;padding:5px 16px;font-size:12px;color:var(--ink-2);background:#F9FAFC;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.strip .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.view{flex:1;overflow:auto;padding:14px 16px 90px}
.view-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}
.view-h h1{font-size:18px;font-weight:600;margin:0}
.view-h .sub{color:var(--ink-3);font-size:12.5px}
.view-h .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px;position:relative}
.kpi:hover{border-color:var(--blue)}
.kpi .n{font-size:22px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .s{font-size:11.5px;color:var(--ink-3)}
.kpi.t-bad .n{color:var(--bad)}.kpi.t-warn .n{color:var(--warn)}
.kpi[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
/* ---------- panels ---------- */
.grid2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.panel-h h2{font-size:14px;font-weight:600;margin:0}
.panel-h .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel-b{padding:10px 12px}
.panel+.panel{margin-top:12px}
/* attention */
.att-scroll{max-height:318px;overflow:auto}
@media (max-width:760px){.att-scroll{max-height:none}}
.att{display:grid;grid-template-columns:150px minmax(0,1fr);border-bottom:1px solid var(--line-2)}
.att:last-child{border-bottom:0}
.att-s{padding:9px 12px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:3px}
.att-s button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--blue)}
.att-s button:focus-visible{outline:2px solid var(--blue)}
.att-i{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.15fr) 96px;gap:4px 12px;padding:8px 12px;border-bottom:1px dashed var(--line-2);align-items:start}
.att-i:last-child{border-bottom:0}
.att-i .t{font-weight:500}
.att-i .meta{font-size:12px;color:var(--ink-3)}
.att-i .nx{font-size:12.5px}
.att-i .ex{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
/* pills & lanes */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;white-space:nowrap;line-height:1.5}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.neutral{background:var(--nt-bg);color:var(--nt)}.pill.info{background:var(--blue-50);color:var(--blue-d)}
.sev{font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;display:inline-block}
.sev.high{background:var(--bad);color:#fff}.sev.medium{background:var(--warn-bg);color:var(--warn);border:1px solid #EFCF95}.sev.low{background:var(--nt-bg);color:var(--nt)}
.lanes{display:inline-grid;grid-template-columns:repeat(5,9px);gap:2px;vertical-align:middle}
.lanes i{height:14px;border-radius:2px;background:var(--nt-bg);border:1px solid #CDD4DE}
.lanes i.ok{background:#5BA77C;border-color:#5BA77C}.lanes i.warn{background:#E2A93B;border-color:#E2A93B}.lanes i.bad{background:#D0473A;border-color:#D0473A}
.lanes-big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin:10px 0}
.lane{padding:7px 10px;border-right:1px solid var(--line);position:relative;background:#fff}
.lane:last-child{border-right:0}
.lane::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--nt-bg)}
.lane.ok::before{background:#5BA77C}.lane.warn::before{background:#E2A93B}.lane.bad::before{background:#D0473A}
.lane small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.lane b{font-size:13px;font-weight:600}
/* tables */
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-2)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:13px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip .c{opacity:.7;margin-left:3px}
.tw{overflow:auto;max-width:100%}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.8px}
table.t th{position:sticky;top:0;background:#F7F9FB;text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;border-bottom:1px solid var(--line);padding:0;white-space:nowrap;z-index:1}
table.t th button{all:unset;cursor:pointer;display:block;padding:7px 10px}
table.t th button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
table.t th .ar{font-size:10px;margin-left:3px}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:#F7FAFE}
table.t tr.sel td{background:var(--blue-50)}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ref{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--blue);white-space:nowrap}
.ref-btn{all:unset;cursor:pointer}.ref-btn:focus-visible{outline:2px solid var(--blue)}
.cell2{display:flex;flex-direction:column;line-height:1.3}
.cell2 small{color:var(--ink-3);font-size:11.5px}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}
.filt-note{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--blue-50);color:var(--blue-d);font-size:12.5px;border-bottom:1px solid #D3E1F5}
.banner{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r);font-size:12.5px;margin-bottom:10px}
.banner.warn{background:var(--warn-bg);color:#6F4100;border:1px solid #F0D7A6}
.banner.bad{background:var(--bad-bg);color:#8A1D14;border:1px solid #F1C4BD}
.banner.info{background:var(--blue-50);color:var(--blue-d);border:1px solid #D3E1F5}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--card);box-shadow:-8px 0 24px rgba(15,35,64,.14);display:flex;flex-direction:column;z-index:30;border-left:1px solid var(--line)}
.dr-h{padding:12px 16px 0;border-bottom:1px solid var(--line)}
.dr-h .row1{display:flex;align-items:flex-start;gap:10px}
.dr-h h2{margin:0;font-size:17px;font-family:var(--mono);font-weight:600}
.dr-h .ttl{font-size:12.5px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 11px;font-size:13px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue);font-weight:600}
.tab:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.dr-b{flex:1;overflow:auto;padding:12px 16px 40px}
.q6{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q{border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 11px;background:#fff}
.q h3{margin:0 0 3px;font-size:12px;color:var(--ink-3);font-weight:500}
.q .a{font-size:14px;font-weight:600;line-height:1.3}
.q .d{font-size:12.3px;color:var(--ink-2);margin-top:3px}
.q.bad{border-left:3px solid var(--bad)}.q.warn{border-left:3px solid #E2A93B}.q.ok{border-left:3px solid #5BA77C}
.sec{margin-top:14px}
.sec h3{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec h3 .r{margin-left:auto;display:flex;gap:6px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:3px 10px;font-size:12.8px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.leg{border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 11px;margin-bottom:8px;position:relative}
.leg-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg-h b{font-size:13px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-2);font-size:12.6px}
.tl li:last-child{border-bottom:0}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;background:#fff;display:flex;flex-direction:column;gap:5px}
.opt.rec{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.dis{background:#FAFBFC;color:var(--ink-3)}
.opt .price{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.opt ul{margin:0;padding-left:16px;font-size:12px;color:var(--ink-2)}
.opt .tags{display:flex;gap:4px;flex-wrap:wrap}
.comp{width:100%;font-size:12.5px;border-collapse:collapse}
.comp td{padding:2px 0}.comp td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.comp tr.tot td{border-top:1px solid var(--line);font-weight:600;padding-top:4px}
.calc{font-family:var(--mono);font-size:12px;background:#F7F9FB;border:1px solid var(--line-2);border-radius:var(--r);padding:7px 9px;color:var(--ink-2)}
.lifecycle{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.lifecycle span{font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--nt-bg);color:var(--ink-3)}
.lifecycle span.on{background:var(--navy);color:#fff}.lifecycle span.done{background:#DCE8F7;color:var(--blue-d)}
.sums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sum{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 12px}
.sum .n{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}.sum .l{font-size:12px;color:var(--ink-2)}.sum .s{font-size:11.5px;color:var(--ink-3)}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 92px;gap:8px;align-items:center;font-size:12.3px}
.bar button{all:unset;cursor:pointer;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar button:hover{color:var(--blue);text-decoration:underline}
.bar button:focus-visible{outline:2px solid var(--blue)}
.bar .track{height:10px;background:var(--nt-bg);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--blue)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.def{font-size:11.8px;color:var(--ink-3);margin-top:6px;border-top:1px dashed var(--line-2);padding-top:6px}
.proj{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.deps{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.gauge{position:relative;height:12px;background:var(--nt-bg);border-radius:3px;margin:8px 0 4px}
.gauge .f{position:absolute;left:0;top:0;bottom:0;background:#5BA77C;border-radius:3px}
.gauge .f.low{background:#D0473A}
.gauge .m{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
/* forms / modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,35,64,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(15,35,64,.25)}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:16px;margin:0;font-weight:600}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.fg .full{grid-column:1/-1}
.f label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 8px;background:#fff}
.f textarea{height:auto;min-height:70px;padding:6px 8px}
.f .hint{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.f.inline{display:flex;gap:6px;align-items:center}
.f input[type=checkbox]{width:auto;height:auto}
.err{color:var(--bad);font-size:12.5px;background:var(--bad-bg);border:1px solid #F1C4BD;padding:6px 9px;border-radius:var(--r);margin-bottom:10px}
.preview{background:#F7F9FB;border:1px dashed var(--line);border-radius:var(--r);padding:8px 10px;font-size:12.3px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:min(680px,92vw);box-shadow:0 8px 24px rgba(15,35,64,.3)}
.toast.err{background:var(--bad)}
/* guide */
.guide{position:fixed;right:16px;bottom:16px;width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(15,35,64,.22);z-index:40;display:flex;flex-direction:column;max-height:70vh}
.guide.min{width:auto}
.has-drawer .guide{right:656px}

/* ---------- quotes & bookings ---------- */

const MODE_RULES = [

/* ---------- reports ---------- */

    onTimePickup: { n: puOnTime.length, d: pickups.length, basis: 'Shipments with an actual pickup; on time if within 2 hours of planned pickup.' },
    risk: { n: act.filter(s => B.riskReasons(S, s).length).length, d: act.length, ids: act.filter(s => B.riskReasons(S, s).length).map(s => s.id), unknown: act.filter(s => ['stale', 'unavailable'].includes(B.tracking(S, s).state)).length, basis: 'Forecast on active shipments; not an on-time result.' },

(function () {
'use strict';
const B = window.BHD, APP = window.APP; const { H, MIN, T, ACCT, ROLES, can, isCustomer, isBHD, byId, sum, money } = B;
const { esc, fmt, utc, loc, ago, dur, pill, sev, siteName, city, docPill, tzOf, table, tstate, ic } = APP;
const pct = (n, d) => d ? Math.round(n / d * 100) + '%' : '—';
const drill = (ids, label, text) => `<button data-act="drill" data-ids="${esc(ids.join(','))}" data-label="${esc(label)}">${esc(text)}</button>`;
function bars(rows, fmtV, label) { const max = Math.max(1, ...rows.map(r => r.v)); return `<div class="bars">${rows.map(r => `<div class="bar">${r.ids ? drill(r.ids, label + ': ' + r.key, r.key) : `<span>${esc(r.key)}</span>`}<div class="track" aria-hidden="true"><div class="fill" style="width:${Math.max(2, r.v / max * 100)}%"></div></div><span class="v">${fmtV(r)}</span></div>`).join('')}</div>`; }

/* ================= Reports ================= */
APP.views.reports = () => {
  const S = APP.get(), UI = APP.ui(); const L = APP.scope(); const R = B.reports(S, L); const f = UI.filters;
  const scopeTxt = [f.project ? (byId(S.projects, f.project) || {}).name : 'All projects', f.site ? siteName(f.site) : 'all sites', f.window ? { next48: 'required next 48 h', next7: 'required next 7 days', past7: 'required past 7 days' }[f.window] : 'any date'].join(' · ');
  return `<div class="view-h"><h1>Reports</h1><span class="sub">${esc(scopeTxt)} · times compared in UTC, displayed in site local time · reference ${esc(utc(S.clock))}</span><div class="act"><button class="btn sm" data-act="export-report">${ic('down')}Export report CSV</button><button class="btn sm" data-act="print-report">Printable summary</button>${can(UI.role, 'configure') ? '<button class="btn sm" data-act="modal" data-m="schedule">Schedule…</button>' : ''}</div></div>
  <div class="rep">
    <section class="panel"><div class="panel-h"><h2>On-time delivery (actual)</h2></div><div class="panel-b"><div class="big">${pct(R.onTimeDelivery.n, R.onTimeDelivery.d)}</div><div class="small">${R.onTimeDelivery.n} of ${R.onTimeDelivery.d} completed eligible shipments · ${drill(R.onTimeDelivery.late, 'Delivered late', R.onTimeDelivery.late.length + ' late')}</div><div class="def">${esc(R.onTimeDelivery.basis)}</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Milestone risk (forecast)</h2></div><div class="panel-b"><div class="big">${R.risk.n} <span class="small muted">of ${R.risk.d} active</span></div><div class="small">${drill(R.risk.ids, 'Forecast risk', 'Show shipments')} · ${R.risk.unknown} with unknown position (counted as unknown, not on time)</div><div class="def">${esc(R.risk.basis)}</div></div></section>
    <section class="panel"><div class="panel-h"><h2>On-time pickup</h2></div><div class="panel-b"><div class="big">${pct(R.onTimePickup.n, R.onTimePickup.d)}</div><div class="small">${R.onTimePickup.n} of ${R.onTimePickup.d}</div><div class="def">${esc(R.onTimePickup.basis)}</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Border dwell and hold reasons</h2></div><div class="panel-b">${bars(R.border.map(b => ({ key: b.id, v: b.dwell, ids: [b.id], hold: b.hold })), r => B.fmtH(r.v), 'Border dwell')}<ul class="tl" style="margin-top:6px">${R.border.map(b => `<li><span class="mono small">${esc(b.id)}</span><span class="small">${esc(b.hold)}</span></li>`).join('')}</ul><div class="def">Dwell = border-facility arrival to crossing (or now). Count: ${R.border.length}.</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Documentation / POD completeness</h2></div><div class="panel-b"><div class="big">${pct(R.pod.n, R.pod.d)}</div><div class="small">${R.pod.n} of ${R.pod.d} delivered shipments have an accepted POD · ${drill(R.pod.missing, 'POD missing', R.pod.missing.length + ' missing')}</div><div class="def">Denominator: delivered shipments in view. A POD under review is not counted as complete.</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Quote response and acceptance</h2></div><div class="panel-b"><dl class="kv"><dt>Requests</dt><dd>${R.quotes.submitted}</dd><dt>Quoted</dt><dd>${R.quotes.quoted} (${pct(R.quotes.quoted, R.quotes.submitted)})</dd><dt>Accepted</dt><dd>${R.quotes.accepted} of ${R.quotes.decided} decided (${pct(R.quotes.accepted, R.quotes.decided)})</dd><dt>Median response</dt><dd>${R.quotes.medianResponseH != null ? B.fmtH(R.quotes.medianResponseH) : '—'}</dd></dl><div class="def">Response = submitted to first quoted version. Expired counts as decided (not accepted).</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Spend by mode</h2></div><div class="panel-b">${bars(R.spendByMode.map(r => ({ key: r.key, v: r.v, ids: r.ids, n: r.n })), r => money(r.v) + ' · ' + r.n, 'Mode')}<div class="def">Customer transportation price (booked), USD. Accessorials reported separately.</div></div></section>
    <section class="panel"><div class="panel-h"><h2>Spend by destination site</h2></div><div class="panel-b">${bars(R.spendBySite.map(r => ({ key: r.key, v: r.v, ids: r.ids, n: r.n })), r => money(r.v) + ' · ' + r.n, 'Site')}</div></section>
    <section class="panel"><div class="panel-h"><h2>Spend by lane (top 6)</h2></div><div class="panel-b">${bars(R.spendByLane.slice(0, 6).map(r => ({ key: r.key, v: r.v, ids: r.ids, n: r.n })), r => money(r.v) + ' · ' + r.n, 'Lane')}</div></section>
    <section class="panel"><div class="panel-h"><h2>Accessorials by type and status</h2></div><div class="panel-b">${bars(R.accessorials.map(r => ({ key: r.key, v: r.usd, ids: r.ids, n: r.n })), r => money(r.v) + ' · ' + r.n, 'Accessorial')}<div class="def">USD equivalent of the current stage amount for each charge (MXN converted at ${esc(B.FX.label.toLowerCase())}). Rejected charges show $0.</div></div></section>
    ${APP.modOn('custody') ? `<section class="panel"><div class="panel-h"><h2>Custody evidence completeness</h2></div><div class="panel-b"><div class="big">${pct(R.custody.n, R.custody.d)}</div><div class="small">${R.custody.n} of ${R.custody.d} shipments with custody records have no evidence gaps · ${drill(R.custody.ids, 'Custody records', 'Show')}</div><div class="def">Only shipments with custody capture enabled or recorded. Unknown condition counts as a gap.</div></div></section>` : ''}
    ${APP.modOn('trailers') && !isCustomer(UI.role) || APP.modOn('trailers') ? `<section class="panel"><div class="panel-h"><h2>Trailer dwell</h2></div><div class="panel-b">${bars(R.trailers.sort((a, b) => b.dwellH - a.dwellH).slice(0, 6).map(t => ({ key: t.id + ' · ' + siteName(t.site), v: t.dwellH })), r => B.fmtH(r.v), 'Trailer')}<div class="def">Time since last arrival at current site. ${R.trailers.filter(t => t.state === 'unknown').length} trailer(s) in unknown state.</div></div></section>` : ''}
  </div>`;
};

/* ================= Projects & Sites ================= */
APP.views.projects = () => {
  const S = APP.get(), UI = APP.ui(); const acct = APP.acctOf(); const L = APP.scope();
  const P = S.projects.filter(p => p.acct === acct && (!UI.filters.project || p.id === UI.filters.project));
  const tone = st => st === 'confirmed' ? 'ok' : st === 'pending' ? 'warn' : 'bad';
  return `<div class="view-h"><h1>Projects & Sites</h1><span class="sub">Shipments grouped against customer milestones. An on-time ETA is not enough if the site cannot receive.</span></div>
  <div class="proj">${P.map(p => { const sh = L.filter(s => s.projectId === p.id && !s.deliveredAt); const threatened = sh.filter(s => B.riskReasons(S, s).length);
    return `<section class="panel"><div class="panel-h"><h2>${esc(p.name)}</h2><span class="small muted">${esc(siteName(p.siteId))}, ${esc(city(p.siteId))}</span><div class="r">${threatened.length ? pill('Milestone threatened', 'bad') : pill('On track', 'ok')}</div></div><div class="panel-b">
      <dl class="kv"><dt>Milestone</dt><dd>${esc(p.milestone)}</dd><dt>Required on site</dt><dd>${loc(p.requiredOnSite, p.siteId)}</dd><dt>Receiving hours</dt><dd>${esc((B.site(S, p.siteId) || {}).receiving || '—')}</dd></dl>
      ${p.deps.length ? `<div class="deps" aria-label="Site dependencies">${p.deps.map(d => `<span class="pill ${tone(d.state)}" title="${esc(d.detail)}">${esc(d.label)}: ${esc(d.state)}</span>`).join('')}</div>${p.deps.filter(d => d.state !== 'confirmed').map(d => `<div class="small" style="margin:3px 0"><b>${esc(d.label)}</b> — ${esc(d.detail)} ${['cust_user', 'cust_approver', 'bhd_ops', 'consignee'].includes(UI.role) ? `<button class="btn sm" data-act="modal" data-m="confirmDep" data-p="${p.id}" data-k="${d.key}">Confirm…</button>` : ''}</div>`).join('')}` : ''}
      <div class="sec"><h3>Shipments feeding this milestone (${sh.length} active)</h3>
      <ul class="tl">${sh.sort((a, b) => a.reqBy - b.reqBy).map(s => { const rr = B.riskReasons(S, s); return `<li><span><button class="ref ref-btn" data-act="open" data-id="${s.id}">${esc(s.id)}</button></span><span class="small">${esc(s.commodity)} · ETA ${loc(B.currentEta(S, s), s.dest)} ${rr.length ? '<br>' + rr.map(r => pill(r.text, 'bad')).join(' ') : pill('On plan', 'ok')}</span></li>`; }).join('') || '<li><span></span><span class="muted">No active shipments.</span></li>'}</ul></div>
    </div></section>`; }).join('')}</div>
  <section class="panel" style="margin-top:12px"><div class="panel-h"><h2>Orders</h2><span class="small muted">Imported orders stay “planned” until booked</span></div>${table('orders', S.orders.filter(o => o.acct === acct), [
    { id: 'po', label: 'PO', get: o => o.po, cell: o => `<span class="mono">${esc(o.po)}</span>` }, { id: 'prj', label: 'Project', get: o => (byId(S.projects, o.projectId) || {}).name || '—' },
    { id: 'src', label: 'Source reference', get: o => o.source }, { id: 'lane', label: 'Lane', get: o => o.origin ? o.origin + ' → ' + o.dest : '—' }, { id: 'st', label: 'Status', get: o => o.status }, { id: 'sh', label: 'Shipments', get: o => o.shipments.join(', ') || '—' }],
    { rowId: o => o.id, rowAct: 'noop', caption: 'Orders' })}</section>`;
};

/* ================= Trailer Pools ================= */
APP.views.trailers = () => {
  const S = APP.get(), UI = APP.ui();
  const usable = sid => S.trailers.filter(t => t.siteId === sid && t.physical === 'empty' && !t.assignment && !t.maintenanceHold);
  const cols = [
    { id: 'id', label: 'Trailer', get: t => t.id, cell: t => `<span class="mono">${esc(t.id)}</span>` }, { id: 'site', label: 'Site', get: t => siteName(t.siteId) },
    { id: 'phys', label: 'Physical (sensor)', get: t => t.physical, cell: t => pill(t.physical, t.physical === 'unknown' ? 'warn' : 'neutral') },
    { id: 'asg', label: 'Shipment-system assignment', get: t => t.assignment || '', cell: t => t.assignment ? `<span class="ref">${esc(t.assignment)}</span>` : '<span class="muted">Unassigned</span>' },
    { id: 'dwell', label: 'Dwell', num: true, get: t => S.clock - t.dwellSince, cell: t => esc(dur(S.clock - t.dwellSince)) },
    { id: 'next', label: 'Next move', get: t => t.nextMove || '' },
    { id: 'sensor', label: 'Sensor freshness', get: t => t.sensorAt, cell: t => { const h = (S.clock - t.sensorAt) / H; return h > 24 ? pill('Stale ' + Math.round(h) + ' h', 'warn') : esc(ago(t.sensorAt)); } },
    { id: 'mnt', label: 'Maintenance', get: t => t.maintenanceHold ? 'Hold' : '', cell: t => t.maintenanceHold ? pill('Hold', 'bad') : '' },
    { id: 'note', label: 'Notes / carrier history', get: t => (t.note || '') + ' ' + t.carriers.join(' → '), cell: t => `<span class="small">${esc(t.note || '')}${t.note ? '<br>' : ''}${esc(t.carriers.join(' → '))}</span>` },
    { id: 'act', label: 'Action', noExport: true, get: () => '', cell: t => can(UI.role, 'trailers') ? `${t.physical === 'unknown' || (S.clock - t.sensorAt) > 24 * H ? `<button class="btn sm" data-act="cmd" data-cmd="yardCheck" data-a='${JSON.stringify({ trailerId: t.id, physical: 'empty' })}'>Yard check: empty</button>` : ''}${t.assignment && t.physical === 'empty' ? `<button class="btn sm" data-act="cmd" data-cmd="reconcileTrailer" data-a='${JSON.stringify({ trailerId: t.id, reason: 'Load not yet built; assignment premature' })}'>Clear assignment</button>` : ''}` : '' },
  ];
  UI.tables.trl = UI.tables.trl || { cols: cols.map(c => c.id), sort: null, selected: [] };
  const exc = S.exceptions.filter(e => e.status !== 'resolved' && e.category === 'Trailer pool');
  return `<div class="view-h"><h1>Trailer Pools</h1><span class="sub">Physical observation (sensor / yard check) is kept separate from shipment-system assignment.</span></div>
  ${exc.length ? `<div class="banner warn" role="status">${exc.map(e => esc(e.title)).join(' · ')}</div>` : ''}
  <div class="pool">${S.pools.map(p => { const u = usable(p.siteId).length; const inbound = S.moves.filter(m => m.to === p.siteId && /Approved/.test(m.status)).reduce((n, m) => n + m.trailers.length, 0);
    return `<div class="panel panel-b"><b>${esc(siteName(p.siteId))}</b><div class="small muted">${esc(city(p.siteId))}</div><div class="gauge" role="img" aria-label="${u} usable empties; minimum ${p.min}, target ${p.target}, maximum ${p.max}"><div class="f ${u < p.min ? 'low' : ''}" style="width:${Math.min(100, u / p.max * 100)}%"></div><div class="m" style="left:${p.min / p.max * 100}%" title="Minimum"></div><div class="m" style="left:${p.target / p.max * 100}%;background:var(--blue)" title="Target"></div></div><div class="small">${u} usable empties · min ${p.min} / target ${p.target} / max ${p.max}${inbound ? ` · ${inbound} inbound` : ''}</div>
    ${u < p.min && can(UI.role, 'trailers') ? `<div class="acts"><button class="btn sm pri" data-act="modal" data-m="powerOnly" data-to="${p.siteId}">Propose power-only move…</button></div>` : ''}</div>`; }).join('')}</div>
  ${S.moves.length ? `<section class="panel" style="margin-bottom:12px"><div class="panel-h"><h2>Power-only moves</h2></div><div class="panel-b"><ul class="tl">${S.moves.map(m => `<li><span class="mono">${esc(m.id)}</span><span>${esc(m.trailers.join(', '))}: ${esc(siteName(m.from))} → ${esc(siteName(m.to))} · est. ${money(m.estCost)} · ${pill(m.status, m.status === 'Completed' ? 'ok' : 'warn')} ${m.status === 'Proposed' && can(UI.role, 'decide_quote') ? `<button class="btn sm pri" data-act="cmd" data-cmd="approveMove" data-a='${JSON.stringify({ moveId: m.id })}'>Approve move</button>` : ''}${m.status === 'Proposed' && !can(UI.role, 'decide_quote') ? '<span class="small muted">Awaiting customer approver</span>' : ''}${/Approved/.test(m.status) && can(UI.role, 'trailers') ? `<button class="btn sm" data-act="cmd" data-cmd="completeMove" data-a='${JSON.stringify({ moveId: m.id })}'>Simulate arrival</button>` : ''}</span></li>`).join('')}</ul></div></section>` : ''}
  <section class="panel">${table('trl', S.trailers, cols, { rowId: t => t.id, rowAct: 'noop', caption: 'Trailers' })}</section>`;
};

/* ================= Custody & Claims ================= */
APP.views.custody = () => {
  const S = APP.get(), UI = APP.ui(); const ids = new Set(APP.scope().map(s => s.id));
  const E = S.custody.filter(c => ids.has(c.shipmentId)).sort((a, b) => b.at - a.at);
  const cols = [
    { id: 'ship', label: 'Shipment', get: c => c.shipmentId, cell: c => `<span class="ref">${esc(c.shipmentId)}</span>` }, { id: 'type', label: 'Event', get: c => c.type },
    { id: 'at', label: 'When (local) · received', get: c => c.at, cell: c => `<div class="cell2"><span>${loc(c.at, c.location)}</span><small>received ${esc(utc(c.receivedAt))} · ${esc(c.source)}</small></div>` },
    { id: 'where', label: 'Where', get: c => siteName(c.location) }, { id: 'who', label: 'Released → received', get: c => c.releasedBy + ' → ' + c.receivedBy, cell: c => `<span class="small">${esc(c.releasedBy)} → ${esc(c.receivedBy)}</span>` },
    { id: 'seal', label: 'Equipment · seal', get: c => c.equipment + ' ' + c.sealObserved, cell: c => `<div class="cell2"><span class="mono small">${esc(c.equipment || '—')}${c.equipmentIn ? ' → ' + esc(c.equipmentIn) : ''}</span><small>${c.sealExpected ? `exp ${esc(c.sealExpected)} / obs ${esc(c.sealObserved)}${c.sealExpected && c.sealObserved && c.sealExpected !== c.sealObserved ? ' ' + pill('Mismatch', 'bad') : ''}` : ''}${c.sealNew ? ' · new ' + esc(c.sealNew) : ''}</small></div>` },
    { id: 'qty', label: 'Items', get: c => c.items.map(i => i.qty).join('+'), cell: c => esc(c.items.map(i => i.qty + (i.serials && i.serials.length ? ` (${i.serials.length} serials)` : '')).join(' + ')) },
    { id: 'cond', label: 'Condition', get: c => c.condition, cell: c => pill(c.condition, c.condition === 'Good' ? 'ok' : c.condition === 'Unknown' ? 'warn' : 'bad') },
    { id: 'ack', label: 'Acknowledged', get: c => (c.ackReleaser ? 'R' : '') + (c.ackReceiver ? 'C' : ''), cell: c => `${c.ackReleaser ? 'Releaser ✓' : '<b style="color:var(--warn)">Releaser missing</b>'}<br>${c.ackReceiver ? 'Receiver ✓' : '<b style="color:var(--warn)">Receiver missing</b>'}` },
    { id: 'gaps', label: 'Evidence gaps', get: c => c.gaps.join('; '), cell: c => c.gaps.length ? c.gaps.map(g => `<div class="small" style="color:var(--warn)">${esc(g)}</div>`).join('') : pill('None', 'ok') },
  ];
  UI.tables.cus = UI.tables.cus || { cols: cols.map(c => c.id), sort: null, selected: [] };
  return `<div class="view-h"><h1>Custody & Claims</h1><span class="sub">Custody is optional by commodity (enabled for: ${esc(APP.C().custodyCommodities.join(', ') || 'none')}). A location ping does not establish custody; a custody interval does not decide liability.</span><div class="act">${can(UI.role, 'custody') ? `<button class="btn pri" data-act="modal" data-m="custody" data-id="DEMO-US-233">Capture handoff…</button>` : ''}<button class="btn sm" data-act="export" data-t="cus">${ic('down')}Export CSV</button></div></div>
  <section class="panel">${table('cus', E, cols, { rowId: c => c.shipmentId, caption: 'Custody events' })}</section>
  ${APP.modOn('claims') ? `<section class="panel" style="margin-top:12px"><div class="panel-h"><h2>Claims intake</h2><span class="small muted">Account-specific claims terms are not confirmed for this proposal.</span></div><div class="panel-b">${S.claims.length ? `<ul class="tl">${S.claims.map(c => `<li><span class="mono">${esc(c.id)}</span><span>${esc(c.shipmentId)} · ${esc(c.incident)} · ${pill(c.status, 'info')} · owner ${esc(c.owner)} · ${c.custodyIds.length} linked custody record(s)</span></li>`).join('')}</ul>` : '<p class="small muted">No claims. Open one from a shipment’s Custody tab.</p>'}</div></section>` : ''}`;
};

/* ================= Settings ================= */
APP.views.settings = () => {
  const S = APP.get(), UI = APP.ui(); const C = APP.C(); const canCfg = can(UI.role, 'configure') || can(UI.role, 'configure_bhd'); const cust = can(UI.role, 'configure');
  const ro = canCfg ? '' : 'disabled';
  return `<div class="view-h"><h1>Account Settings</h1><span class="sub">${esc(C.name)} · settings are scoped to this account and cannot change past approvals or audit history.</span></div>
  ${!canCfg ? `<div class="banner info">You can view these settings. A customer approver/admin can change them.</div>` : ''}
  <div class="proj">
   <section class="panel"><div class="panel-h"><h2>Custom fields</h2></div><div class="panel-b">${C.customFields.length ? `<ul class="tl">${C.customFields.map(f => `<li><span class="mono small">${esc(f.key)}</span><span>${esc(f.label)} · ${esc(f.type)} · on shipments, filters and exports</span></li>`).join('')}</ul>` : '<p class="small muted">No custom fields yet.</p>'}
     <div class="f inline" style="margin-top:8px"><label for="cf-new" class="sr">New field name</label><input id="cf-new" class="inp" placeholder="e.g. Installation package" ${ro}><button class="btn" data-act="add-cf" ${ro}>Add field</button></div></div></section>
   <section class="panel"><div class="panel-h"><h2>Saved views</h2></div><div class="panel-b">${C.savedViews.length ? `<ul class="tl">${C.savedViews.map(v => `<li><span>${esc(v.name)}</span><span class="small">${esc(Object.entries(v.filters).filter(([, x]) => x).map(([k, x]) => k + '=' + ((byId(S.projects, x) || {}).name || (typeof x === 'object' ? JSON.stringify(x) : x))).join(', ') || 'No filters')} · ${v.columns.length} columns <button class="btn sm" data-act="apply-view-btn" data-id="${v.id}">Open</button> <button class="btn sm ghost" data-act="cmd" data-cmd="deleteView" data-a='${JSON.stringify({ viewId: v.id })}'>Delete</button></span></li>`).join('')}</ul>` : '<p class="small muted">Save a view from the Shipments list.</p>'}</div></section>
   <section class="panel"><div class="panel-h"><h2>Modules</h2></div><div class="panel-b">${[['projects', 'Projects & Sites'], ['trailers', 'Trailer Pools'], ['custody', 'Custody & evidence'], ['claims', 'Claims intake']].map(([k, l]) => `<div class="f inline"><input type="checkbox" id="mod-${k}" data-change="module" data-k="${k}" ${C.modules[k] ? 'checked' : ''} ${ro}><label for="mod-${k}" style="margin:0">${l}</label></div>`).join('')}<p class="small muted">Authorization and audit controls are always on and cannot be disabled.</p></div></section>
   <section class="panel"><div class="panel-h"><h2>Alert thresholds</h2></div><div class="panel-b fg">
     <div class="f"><label for="al-stale">Tracking stale after (hours)</label><input id="al-stale" type="number" min="1" max="24" value="${C.alerts.staleHours}" ${ro}></div>
     <div class="f"><label for="al-dwell">Border dwell alert (hours)</label><input id="al-dwell" type="number" min="1" max="72" value="${C.alerts.dwellHours}" ${ro}></div>
     <div class="f"><label for="al-eta">ETA variance alert (hours)</label><input id="al-eta" type="number" min="0" max="24" value="${C.alerts.etaVarianceHours}" ${ro}></div>
     <div class="f" style="align-self:end"><button class="btn" data-act="save-alerts" ${ro}>Save thresholds</button></div></div></section>

  <div class="guide-b">${cur ? `<div class="min-tag">${esc(cur.m)}${cur.who ? ' · ' + esc(cur.who) : ''}</div><h3>${esc(cur.t)}</h3><div class="say">${esc(cur.say)}</div>` : `<h3>Walkthrough complete</h3><div class="say">Visible problem, accountable action, measurable outcome. Every step left history in the shipment record.</div>`}
  <ol>${G.map((x, i) => `<li class="${i < g.step ? 'done' : i === g.step ? 'cur' : ''}">${esc(x.t)}</li>`).join('')}</ol></div>

}

  return [['On-time delivery', R.onTimeDelivery.n, R.onTimeDelivery.d, R.onTimeDelivery.basis], ['On-time pickup', R.onTimePickup.n, R.onTimePickup.d, R.onTimePickup.basis], ['Milestone risk (forecast)', R.risk.n, R.risk.d, R.risk.basis], ['POD completeness', R.pod.n, R.pod.d, 'Delivered shipments with accepted POD'], ['Quotes accepted', R.quotes.accepted, R.quotes.decided, 'Of decided quotes'], ['Custody evidence complete', R.custody.n, R.custody.d, 'Shipments with custody records']].concat(R.spendByMode.map(m => ['Spend: ' + m.key, Math.round(m.v), m.n, 'USD customer transportation; n = shipments'])).map(r => r.concat([scope])); }

/* ---------- events ---------- */
const H_ = {};
H_['go'] = el => { APP.ui().drawer = APP.ui().drawer && el.closest('.drawer') ? null : APP.ui().drawer; APP.go(el.dataset.r); };
H_['open'] = el => { const UI = APP.ui(); UI.drawer = { id: el.dataset.id, tab: el.dataset.tab || (UI.drawer && UI.drawer.id === el.dataset.id ? UI.drawer.tab : 'summary') }; APP.persist(); APP.render(); setTimeout(() => { const t = document.getElementById('dr-title'); if (t) { t.tabIndex = -1; t.focus(); } }, 0); };
H_['open-docs'] = el => { el.dataset.tab = 'docs'; H_.open(el); };
H_['close-drawer'] = () => { APP.ui().drawer = null; APP.persist(); APP.render(); const v = document.getElementById('view'); if (v) v.focus({ preventScroll: true }); };
H_['dtab'] = el => { APP.ui().drawer.tab = el.dataset.v; APP.persist(); APP.render(); };
H_['kpi'] = el => { const UI = APP.ui(); const r = el.dataset.r; if (r === 'shipments') { const t = APP.tstate('shipments', APP.shipCols().filter(c => c.def !== false).map(c => c.id)); t.kpi = el.dataset.k; t.ids = null; UI.shipTab = 'list'; } APP.go(r); };
H_['quick'] = el => { const t = APP.tstate('shipments', []); t.quick = el.dataset.k; t.kpi = null; t.ids = null; APP.persist(); APP.render(); };
H_['quick-t'] = el => { const t = APP.tstate(el.dataset.t, []); t.quick = el.dataset.k; APP.persist(); APP.render(); };
H_['clear-kpi'] = () => { const t = APP.tstate('shipments', []); t.kpi = null; t.ids = null; APP.persist(); APP.render(); };
H_['clear-cf'] = () => { APP.tstate('shipments', []).cf = null; APP.persist(); APP.render(); };
H_['clear-sel'] = () => { APP.tstate('shipments', []).selected = []; APP.persist(); APP.render(); };
H_['clear-all-filters'] = () => { const UI = APP.ui(); UI.filters = { project: '', site: '', window: '' }; const t = APP.tstate('shipments', []); Object.assign(t, { kpi: null, ids: null, q: '', cf: null, quick: 'all' }); APP.persist(); APP.render(); };
H_['drill'] = el => { const t = APP.tstate('shipments', APP.shipCols().filter(c => c.def !== false).map(c => c.id)); t.ids = el.dataset.ids ? el.dataset.ids.split(',') : []; t.idsLabel = el.dataset.label; t.kpi = null; APP.ui().shipTab = 'list'; APP.go('shipments'); };
H_['att-all'] = () => { const t = APP.tstate('shipments', APP.shipCols().filter(c => c.def !== false).map(c => c.id)); t.kpi = 'atRisk'; APP.go('shipments'); };
H_['sort'] = el => { const t = APP.ui().tables[el.dataset.t]; if (!t) return; t.sort = t.sort && t.sort.id === el.dataset.c ? (t.sort.dir > 0 ? { id: el.dataset.c, dir: -1 } : null) : { id: el.dataset.c, dir: 1 }; APP.persist(); APP.render(); };
H_['tsel'] = (el, ev) => { ev.stopPropagation(); const t = APP.ui().tables[el.dataset.t]; const i = t.selected.indexOf(el.dataset.id); if (i >= 0) t.selected.splice(i, 1); else t.selected.push(el.dataset.id); APP.persist(); APP.render(); };
H_['export'] = el => APP.exportTable(el.dataset.t, el.dataset.t);
H_['modal'] = el => { const UI = APP.ui(); UI.modal = Object.assign({ type: el.dataset.m }, el.dataset); delete UI.modal.act; UI.modal._new = true; APP.render(); };
H_['modal-close'] = () => { APP.ui().modal = null; APP.render(); };
H_['modal-bg'] = (el, ev) => { if (ev.target === el) H_['modal-close'](); };
H_['modal-ok'] = el => modalOk(el);
H_['cmd'] = el => { let a = {}; try { a = JSON.parse(el.dataset.a || '{}'); } catch (e) { } exec(APP.ui().role, el.dataset.cmd, a); };
H_['accept-opt'] = el => exec(APP.ui().role, 'acceptOption', { quoteId: el.dataset.q, optionId: el.dataset.id });
H_['issue-quote'] = el => exec(APP.ui().role, 'issueQuote', { quoteId: el.dataset.id, batteryReviewed: !!el.dataset.battery });
H_['sel-quote'] = el => { APP.ui().selQuote = el.dataset.id; APP.persist(); APP.render(); };
H_['sel-acc'] = el => { APP.ui().selAcc = el.dataset.id; APP.persist(); APP.render(); };
H_['open-quote'] = el => { const UI = APP.ui(); UI.selQuote = el.dataset.id; UI.drawer = null; APP.go('quotes'); };
H_['open-acc'] = el => { const UI = APP.ui(); UI.selAcc = el.dataset.id; UI.drawer = null; APP.go('costs'); };
H_['noop'] = () => { };
H_['ship-tab'] = el => { APP.ui().shipTab = el.dataset.v; APP.persist(); APP.render(); };
H_['border-tab'] = el => { APP.ui().borderTab = el.dataset.v; APP.persist(); APP.render(); };
H_['toggle-map'] = () => { APP.ui().showMap = !APP.ui().showMap; APP.render(); };
H_['retry-adapter'] = el => exec(APP.ui().role, 'retryAdapter', { key: el.dataset.k });
H_['clock'] = el => exec(APP.ui().role, 'setClock', { to: APP.get().clock + Number(el.dataset.h) * H });
H_['reset'] = () => { APP.ui().modal = { type: 'confirmReset' }; APP.render(); };
H_['selfcheck'] = () => { APP._checks = B.selfCheck(); const f = APP._checks.filter(c => c.result !== 'PASS').length; toast(`${APP._checks.length - f} of ${APP._checks.length} checks passed.`, !!f); APP.render(); };
H_['add-note'] = el => { const UI = APP.ui(); const aud = can(UI.role, 'internal_note') && UI.noteAud !== 'shared' ? 'internal' : 'shared'; exec(UI.role, 'addComment', { shipmentId: el.dataset.id, audience: aud, text: val('note-txt') }); };
H_['add-cf'] = () => { const UI = APP.ui(); const r = exec(UI.role, 'addCustomField', { label: val('cf-new') }); if (r.ok) { const t = APP.tstate('shipments', APP.shipCols().filter(c => c.def !== false).map(c => c.id)); if (!t.cols.includes(r.key)) t.cols.splice(1, 0, r.key); APP.persist(); APP.render(); } };
H_['save-alerts'] = () => exec(APP.ui().role, 'setAlerts', { staleHours: val('al-stale'), dwellHours: val('al-dwell'), etaVarianceHours: val('al-eta') });
H_['save-routing'] = () => exec(APP.ui().role, 'setRouting', { limit: val('ap-lim') });
H_['invite'] = () => exec(APP.ui().role, 'inviteUser', { email: val('inv-email'), role: val('inv-role') });
H_['apply-view-btn'] = el => applyView(el.dataset.id);
H_['present'] = () => { const UI = APP.ui(); UI.presenting = !UI.presenting; if (UI.presenting) UI.role = 'cust_approver'; APP.persist(); APP.render(); };
H_['guide-start'] = () => { const UI = APP.ui(); UI.guide = { open: true, step: 0, ask: APP.get().meta.version > 1 }; UI.presenting = true; UI.role = 'cust_approver'; if (!UI.guide.ask) G[0].run(); APP.persist(); APP.render(); };
H_['guide-reset'] = () => { APP.reset(); const UI = APP.ui(); UI.guide = { open: true, step: 0 }; UI.presenting = true; UI.role = 'cust_approver'; G[0].run(); APP.render(); };
H_['guide-continue'] = () => { const UI = APP.ui(); UI.guide.ask = false; G[0].run(); APP.render(); };
H_['guide-close'] = () => { APP.ui().guide.open = false; APP.persist(); APP.render(); };
H_['guide-min'] = () => { APP.ui().guide.min = true; APP.render(); };
H_['guide-max'] = () => { APP.ui().guide.min = false; APP.render(); };
H_['guide-back'] = () => { const g = APP.ui().guide; g.step = Math.max(0, g.step - 1); APP.render(); };
H_['guide-do'] = async el => { const UI = APP.ui(); const g = UI.guide; const step = G[g.step]; if (!step) return; el.disabled = true; try { await step.run(); } catch (e) { console.error(e); toast('Step failed: ' + e.message, true); } g.step++; if (g.step === 1) { } APP.persist(); APP.render(); };
H_['dl-doc'] = async el => { const S = APP.get(), UI = APP.ui(); const v = byId(S.docVersions, el.dataset.id); if (!v || !B.visibleDocs(S, UI.role, v.shipmentId).some(x => x.id === v.id)) return toast('Permission denied: this document is not shared with you.', true);
  let blob = v.blobKey ? await APP.getBlob(v.blobKey) : null; if (!blob) blob = makePdf([`${v.fileName}`, `Shipment ${v.shipmentId}`, `Uploaded by ${v.uploadedBy} at ${utc(v.uploadedAt)}`, v.audience === 'redacted' ? 'Shared copy - carrier identity and rate fields redacted' : 'Fixture document (no original file in this demo)']);
  try { const u = URL.createObjectURL(blob); const w = window.open(u, '_blank', 'noopener'); if (!w) { const a = document.createElement('a'); a.href = u; a.download = v.fileName; document.body.appendChild(a); a.click(); a.remove(); } setTimeout(() => URL.revokeObjectURL(u), 60000); } catch (e) { toast('This browser cannot open files from the demo.', true); } };
H_['packet'] = el => { APP.ui().modal = { type: 'packet', id: el.dataset.id }; APP.render(); };
H_['packet-print'] = el => printHTML(APP.packetHTML(el.dataset.id));
H_['packet-dl'] = el => APP.download(`<!doctype html><meta charset="utf-8"><title>${el.dataset.id} packet</title><body style="font-family:sans-serif">${APP.packetHTML(el.dataset.id)}</body>`, el.dataset.id + '_packet.html', 'text/html');
H_['print-list'] = () => listPrint();
H_['print-report'] = () => { const rows = reportRows(); printHTML(`<h1>Report summary — ${esc(APP.C().name)}</h1><p>Demo data · reference ${esc(utc(APP.get().clock))}</p><table><tr><th>Measure</th><th>Count</th><th>Denominator</th><th>Definition</th></tr>${rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</table><p>Scope: ${esc(rows[0][4])}</p>`); };
H_['export-report'] = () => APP.download(B.toCSV(['Measure', 'Count / value', 'Denominator / n', 'Definition', 'Scope'], reportRows()), `report_${APP.acctOf()}.csv`, 'text/csv');
H_['export-audit'] = () => { const S = APP.get(); APP.download(B.toCSV(['at_utc', 'actor', 'action', 'object', 'id', 'detail', 'audience'], S.audit.map(a => [new Date(a.at).toISOString(), a.actor, a.action, a.objectType, a.objectId, a.detail, a.audience])), 'audit_log.csv', 'text/csv'); };
H_['import-check'] = async () => { const UI = APP.ui(); const M = UI.modal; M.data = M.data || {}; const f = document.getElementById('m-csvf'); let text = val('m-csv'); if (f && f.files[0]) { if (!/\.csv$/i.test(f.files[0].name)) { M.err = 'Only .csv files are accepted. Save XLSX as CSV first.'; return APP.render(); } text = await f.files[0].text(); M.data.fileName = f.files[0].name; }
  const rows = B.parseCSV(text); if (rows.length < 2) { M.err = 'Need a header row and at least one data row.'; return APP.render(); }
  const changedText = M.data.text !== text; M.data.text = text; M.data.rows = rows;
  M.data.mapping = changedText || !M.data.mapping ? B.guessMapping(rows[0]) : Object.fromEntries(B.IMPORT_FIELDS.map(([k]) => [k, val('m-map-' + k) === '' ? undefined : Number(val('m-map-' + k))]));
  M.data.result = B.validateImport(APP.get(), rows.slice(1), M.data.mapping); M.err = null; APP.render(); };
function applyView(id) { const UI = APP.ui(); const v = APP.C().savedViews.find(x => x.id === id); if (!v) return; UI.filters = { project: v.filters.project || '', site: v.filters.site || '', window: v.filters.window || '' }; const t = APP.tstate('shipments', []); if (v.columns.length) t.cols = v.columns.slice(); t.quick = v.filters.quick || 'all'; t.kpi = v.filters.kpi || null; t.cf = v.filters.cf || null; t.ids = null; t.view = v.id; UI.shipTab = 'list'; toast(`View “${v.name}” applied.`); APP.go('shipments'); }

document.addEventListener('click', ev => { const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return; const f = H_[el.dataset.act]; if (f) { if (el.tagName === 'A') ev.preventDefault(); f(el, ev); } });
document.addEventListener('change', ev => {
  const el = ev.target; const k = el.dataset.change; if (!k) return; const UI = APP.ui();
  if (k === 'role') { UI.role = el.value; if (!APP.routeAllowed(UI.route)) UI.route = 'overview'; APP.persist(); APP.render(); toast(`Viewing as ${ROLES[UI.role].label} (demo role switch — not authentication).`); }
  else if (k === 'acct') exec(UI.role, 'switchAccount', { acct: el.value }, { quiet: true });
  else if (k === 'filter') { UI.filters[el.dataset.k] = el.value; APP.persist(); APP.render(); }
  else if (k === 'apply-view') { if (el.value) applyView(el.value); }
  else if (k === 'cf-filter') { const t = APP.tstate('shipments', []); t.cf = el.value ? { key: el.dataset.k, value: el.value } : null; APP.persist(); APP.render(); }
  else if (k === 'module') exec(UI.role, 'setModules', { modules: { [el.dataset.k]: el.checked } });
  else if (k === 'notif') exec(UI.role, 'setNotification', { key: el.dataset.k, on: el.checked });
  else if (k === 'note-aud') { UI.noteAud = el.value; const keep = val('note-txt'); APP.render(); const t = document.getElementById('note-txt'); if (t) t.value = keep; }
  else if (k === 'custody-ship') { UI.modal.id = el.value; APP.render(); }
  else if (k === 'po-from') { UI.modal.from = el.value; APP.render(); }
});
let inT;
document.addEventListener('input', ev => {
  const el = ev.target; const k = el.dataset.key; if (!k) return; const UI = APP.ui();
  if (k === 'gsearch') { UI.search = el.value; return; }
  if (k === 'tq') { clearTimeout(inT); inT = setTimeout(() => { APP.tstate(el.dataset.t, []).q = el.value; APP.persist(); APP.render(); }, 180); }
});
document.addEventListener('keydown', ev => {
  const UI = APP.ui();
  if (ev.key === 'Escape') { if (UI.modal) { UI.modal = null; APP.render(); } else if (UI.drawer) H_['close-drawer'](); }
  if (ev.key === 'Enter' && ev.target.id === 'gsearch') {
    const q = ev.target.value.trim().toLowerCase(); if (!q) return; const L = B.visibleShipments(APP.get(), UI.role);
    const hit = L.filter(s => s.id.toLowerCase() === q || s.po.toLowerCase() === q || s.id.toLowerCase().endsWith(q) || Object.values(s.custom).some(v => String(v).toLowerCase() === q));
    if (hit.length === 1) { UI.drawer = { id: hit[0].id, tab: 'summary' }; APP.persist(); APP.render(); toast(`Opened ${hit[0].id}.`); }
    else { const t = APP.tstate('shipments', APP.shipCols().filter(c => c.def !== false).map(c => c.id)); t.q = ev.target.value.trim(); t.kpi = null; t.ids = null; t.quick = 'all'; UI.shipTab = 'list'; APP.go('shipments'); toast(hit.length ? `${hit.length} matches.` : 'No exact match — showing the closest results.'); }
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr.row')) { ev.preventDefault(); ev.target.click(); }
});

/* ---------- render ---------- */
APP.render = function () {
  const root = document.getElementById('root'); const UI = APP.ui();
  const ae = document.activeElement; const aid = ae && ae.id; let ss = null, se = null; try { ss = ae.selectionStart; se = ae.selectionEnd; } catch (e) { }
  const vs = document.getElementById('view'), ds = document.querySelector('.dr-b'); const vTop = vs ? vs.scrollTop : 0, dTop = ds ? ds.scrollTop : 0; const prevDrawer = APP._prevDrawer;
  let viewHTML;
  try { viewHTML = APP.chrome(); } catch (e) { console.error(e); viewHTML = `<div class="skel"><b>Something went wrong rendering this view.</b><br>${esc(e.message)}<br><button class="btn" data-act="go" data-r="overview">Back to overview</button></div>`; }
  document.body.classList.toggle('has-drawer', !!UI.drawer);
  root.innerHTML = `<div class="app">${viewHTML}</div>${APP.drawer()}${guideHTML()}${modalHTML()}`;
  const v2 = document.getElementById('view'); if (v2) v2.scrollTop = vTop;
  const d2 = document.querySelector('.dr-b'); if (d2 && prevDrawer && UI.drawer && prevDrawer.id === UI.drawer.id && prevDrawer.tab === UI.drawer.tab) d2.scrollTop = dTop;
  APP._prevDrawer = UI.drawer ? Object.assign({}, UI.drawer) : null;
  if (UI.modal && UI.modal._new) { UI.modal._new = false; const f = document.querySelector('.modal input:not([type=hidden]):not([disabled]), .modal select, .modal textarea, .modal button'); if (f) f.focus(); }
  else if (aid) { const n = document.getElementById(aid); if (n) { n.focus({ preventScroll: true }); try { if (ss != null) n.setSelectionRange(ss, se); } catch (e) { } } }
  document.querySelectorAll('tr.row').forEach(tr => tr.tabIndex = 0);
};
const _view = () => { const UI = APP.ui(); if (!APP.routeAllowed(UI.route)) return `<div class="view-h"><h1>Not available</h1></div><div class="panel"><div class="empty"><b>Permission denied</b>${esc(ROLES[UI.role].label)} cannot open this area${['trailers', 'projects', 'custody'].includes(UI.route) ? ', or the module is turned off for this account' : ''}. <button class="btn sm" data-act="go" data-r="overview">Go to overview</button></div></div>`; const f = APP.views[UI.route]; return f ? f() : APP.views.overview(); };
window.view = _view;
/* boot */
document.getElementById('root').innerHTML = '<div class="skel" role="status">Loading shipment data…</div>';
setTimeout(() => { APP.render(); if (!APP.store.ok) toast(APP.store.why, true); }, 120);
})();
